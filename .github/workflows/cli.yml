name: Publish CLI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish the CLI at the site version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ ! -f scripts/sync-cli-version.mjs ]; then
            echo "This tag has no CLI release script."
            exit 0
          fi
          node scripts/sync-cli-version.mjs
          cd cli
          version=$(node -p "require('./package.json').version")
          if npm view "@aloneday/lumenui@${version}" version >/dev/null 2>&1; then
            echo "@aloneday/lumenui@${version} is already on npm."
            exit 0
          fi
          npm publish --access public
